<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">8-Point FFT Butterfly Structure (Radix-2 DIT)</text>
  
  <!-- Column Headers -->
  <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6366f1">Input</text>
  <text x="80" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6366f1">(Bit-Reversed)</text>
  
  <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8b5cf6">Stage 1</text>
  <text x="250" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8b5cf6">W⁰ only</text>
  
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a855f7">Stage 2</text>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a855f7">W⁰, W²</text>
  
  <text x="650" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c026d3">Stage 3</text>
  <text x="650" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c026d3">W⁰, W¹, W², W³</text>
  
  <text x="790" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">Output</text>
  <text x="790" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">X[k]</text>
  
  <!-- Vertical lines for columns -->
  <line x1="160" y1="100" x2="160" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="350" y1="100" x2="350" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="100" x2="550" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="730" y1="100" x2="730" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Input nodes (bit-reversed order: 0,4,2,6,1,5,3,7) -->
  <circle cx="80" cy="130" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[0]</text>
  
  <circle cx="80" cy="180" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[4]</text>
  
  <circle cx="80" cy="230" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[2]</text>
  
  <circle cx="80" cy="280" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[6]</text>
  
  <circle cx="80" cy="330" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[1]</text>
  
  <circle cx="80" cy="380" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[5]</text>
  
  <circle cx="80" cy="430" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[3]</text>
  
  <circle cx="80" cy="480" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x[7]</text>
  
  <!-- Stage 1 nodes -->
