  <!-- BF 6-7 -->
  <line x1="98" y1="430" x2="235" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="98" y1="480" x2="235" y2="480" stroke="#333" stroke-width="1.5"/>
  <line x1="170" y1="430" x2="235" y2="480" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="170" y1="480" x2="235" y2="430" stroke="#dc2626" stroke-width="1.5"/>
  <text x="190" y="468" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W⁰</text>
  
  <!-- Stage 2 butterflies (distance 2) -->
  <!-- BF 0-2 -->
  <line x1="262" y1="130" x2="435" y2="130" stroke="#333" stroke-width="1.5"/>
  <line x1="262" y1="230" x2="435" y2="230" stroke="#333" stroke-width="1.5"/>
  <line x1="350" y1="130" x2="435" y2="230" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="350" y1="230" x2="435" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="195" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W⁰</text>
  
  <!-- BF 1-3 -->
  <line x1="262" y1="180" x2="435" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="262" y1="280" x2="435" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="350" y1="180" x2="435" y2="280" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="350" y1="280" x2="435" y2="180" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="245" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W²</text>
  
  <!-- BF 4-6 -->
  <line x1="262" y1="330" x2="435" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="262" y1="430" x2="435" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="350" y1="330" x2="435" y2="430" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="350" y1="430" x2="435" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="395" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W⁰</text>
  
  <!-- BF 5-7 -->
  <line x1="262" y1="380" x2="435" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="262" y1="480" x2="435" y2="480" stroke="#333" stroke-width="1.5"/>
  <line x1="350" y1="380" x2="435" y2="480" stroke="#dc2626" stroke-width="1.5"/>
