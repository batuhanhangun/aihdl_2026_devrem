  <line x1="462" y1="380" x2="635" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="550" y1="180" x2="635" y2="380" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="550" y1="380" x2="635" y2="180" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="295" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W¹</text>
  
