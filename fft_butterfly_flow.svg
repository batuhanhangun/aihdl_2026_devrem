  <circle cx="650" cy="280" r="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <circle cx="650" cy="330" r="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <circle cx="650" cy="380" r="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <circle cx="650" cy="430" r="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
