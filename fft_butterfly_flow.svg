  <text x="790" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">X[0]</text>
  
  <circle cx="790" cy="180" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">X[1]</text>
  
  <circle cx="790" cy="230" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
