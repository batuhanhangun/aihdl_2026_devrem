  <line x1="462" y1="330" x2="635" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="550" y1="130" x2="635" y2="330" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="550" y1="330" x2="635" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="9" fill="#dc2626">W⁰</text>
  
