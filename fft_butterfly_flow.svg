  <circle cx="250" cy="430" r="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="250" cy="480" r="12" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Stage 2 nodes -->
  <circle cx="450" cy="130" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
