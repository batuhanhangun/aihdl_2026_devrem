  <line x1="462" y1="230" x2="635" y2="230" stroke="#333" stroke-width="1.5"/>
  <line x1="462" y1="430" x2="635" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="550" y1="230" x2="635" y2="430" stroke="#dc2626" stroke-width="1.5"/>
