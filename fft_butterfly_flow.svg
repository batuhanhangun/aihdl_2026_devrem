  <circle cx="450" cy="230" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="450" cy="280" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="450" cy="330" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="450" cy="380" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="450" cy="430" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  <circle cx="450" cy="480" r="12" fill="#fae8ff" stroke="#a855f7" stroke-width="2"/>
  
