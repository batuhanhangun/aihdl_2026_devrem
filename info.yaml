# Tiny Tapeout project information
project:
  title:        "8-Point FFT Accelerator Peripheral"
  author:       "Batuhan Hangun, Safak Sahin"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Radix-2 DIT 8-point FFT accelerator with SPI interface for TinyQV RISC-V, security-hardened (9 countermeasures)"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     71500000  # Clock frequency in Hz (~71.5MHz, 14ns period per config.json)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Do not change the top module here.  Instead change tt_wrapper.v line 38 to refer to your module.
  top_module:  "tt_um_tqv_peripheral_harness"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "fft_8point.v"
    - "peripheral.v"
    - "tt_wrapper.v"
    - "test_harness/falling_edge_detector.sv"
    - "test_harness/rising_edge_detector.sv"
    - "test_harness/reclocking.sv"
    - "test_harness/spi_reg.sv"
    - "test_harness/synchronizer.sv"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused"
  ui[1]: "unused"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  # Outputs
  uo[0]: "fft_busy"
  uo[1]: "fft_done"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "user_interrupt"
  uio[1]: "data_ready"
  uio[2]: ""
  uio[3]: "spi_miso"
  uio[4]: "spi_cs_n"
  uio[5]: "spi_clk"
  uio[6]: "spi_mosi"
  uio[7]: ""

# Do not change!
yaml_version: 6
